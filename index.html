<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Intra · Base de Conocimiento Interactiva</title>
<meta name="description" content="Onboarding interactivo para construir la Base de Conocimiento de tu agente de IA — by intralabs.ai" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="bg-aurora"></div>
<div class="bg-grid"></div>
<div class="orb a"></div>
<div class="orb b"></div>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">i</div>
      <div>intra<small>Base de Conocimiento</small></div>
    </div>
    <div class="save-pill" id="savePill"><span class="dot"></span><span id="saveTxt">Guardado automático</span></div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-meta">
      <span id="progressLabel">Paso 1</span>
      <span id="progressPct">0% completado</span>
    </div>
    <div class="steps-nav" id="stepsNav"></div>
  </div>

  <div id="stage"></div>
</div>

<div class="toast" id="toast"><span class="ti">✓</span><span id="toastTxt"></span></div>

<!-- Librerías y módulos compartidos -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="schema.js"></script>
<script src="app-data.js"></script>

<script>
/* ============================================================
   INTRA · Wizard (cliente). El envío se guarda en Supabase vía KB.
   ============================================================ */
let state = { current:0, data:{}, submissionId:null, submitted:false };
const stage = document.getElementById('stage');

function load(){
  try{ const raw=localStorage.getItem(ACTIVE_SCHEMA.storageKey);
    if(raw){ const p=JSON.parse(raw); state.data=p.data||{}; state.current=p.current||0;
      state.submissionId=p.submissionId||null; state.submitted=!!p.submitted; } }catch(e){}
}
let saveTimer;
function save(){
  localStorage.setItem(ACTIVE_SCHEMA.storageKey, JSON.stringify(state));
  const pill=document.getElementById('savePill'), txt=document.getElementById('saveTxt');
  pill.classList.add('saved'); txt.textContent='Guardado ✓';
  clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ pill.classList.remove('saved'); txt.textContent='Guardado automático'; },1800);
}
function d(stepId){ return state.data[stepId] || (state.data[stepId]={}); }
const esc=KB.esc, stripTags=KB.stripTags;

/* ---------- Render de campos ---------- */
function fieldHTML(f, val){
  const req=f.req?'<span class="req">*</span>':'';
  const help=f.help?`<span class="help">${esc(f.help)}</span>`:'';
  let input='';
  if(f.type==='textarea') input=`<textarea data-key="${f.key}" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
  else if(f.type==='select') input=`<select data-key="${f.key}">`+f.options.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${o===''?'Selecciona…':esc(o)}</option>`).join('')+`</select>`;
  else input=`<input data-key="${f.key}" type="${f.type==='time'?'time':(f.type==='number'?'number':'text')}" placeholder="${esc(f.ph||'')}" value="${esc(val)}" />`;
  return `<div class="field ${f.full?'full':''}" data-field="${f.key}"><label>${esc(f.label)} ${req}</label>${help}${input}<span class="errmsg">Este campo es obligatorio</span></div>`;
}
function toggleHTML(t, store){
  const on=!!store[t.key]; const detailVal=store[t.key+'_detalle']||'';
  return `<div class="toggle-field ${on?'on':''}" data-toggle="${t.key}">
    <div class="toggle-row"><div class="tl"><strong>${esc(t.label)}</strong>${t.sub?`<span>${esc(t.sub)}</span>`:''}</div>
    <label class="switch"><input type="checkbox" data-toggle-input="${t.key}" ${on?'checked':''}/><span class="slider"></span></label></div>
    ${t.detail?`<div class="toggle-detail"><div class="field"><input data-key="${t.key}_detalle" placeholder="${esc(t.detail)}" value="${esc(detailVal)}" /></div></div>`:''}</div>`;
}
function repeaterHTML(f, store){
  const items=store[f.key]||[];
  const rows=items.map((it,idx)=>repItemHTML(f,it,idx)).join('');
  return `<div class="repeater" data-repeater="${f.key}">
    <div class="rep-head"><div class="rt">${esc(f.label)} <span class="count">${items.length}</span></div></div>
    <div class="rep-list">${rows||'<div class="section-note"><span class="ico">👉</span><span>Aún no agregas ninguno. Usa el botón de abajo para empezar.</span></div>'}</div>
    <button class="add-btn" data-add="${f.key}"><span>＋</span> ${esc(f.addLabel)}</button></div>`;
}
function repItemHTML(f, it, idx){
  const fields=f.item.fields.map(sf=>{
    const v=it[sf.key]||'';
    if(sf.type==='textarea') return `<div class="field full" data-field="${sf.key}"><label>${esc(sf.label)}</label><textarea data-rep="${f.key}" data-idx="${idx}" data-key="${sf.key}" placeholder="${esc(sf.ph||'')}">${esc(v)}</textarea></div>`;
    return `<div class="field ${sf.full?'full':''}" data-field="${sf.key}"><label>${esc(sf.label)}</label><input data-rep="${f.key}" data-idx="${idx}" data-key="${sf.key}" type="${sf.type==='number'?'number':'text'}" placeholder="${esc(sf.ph||'')}" value="${esc(v)}" /></div>`;
  }).join('');
  let caps='';
  if(f.item.capacities) caps=`<div class="cap-grid">`+f.item.capacities.map(c=>`<div class="cap"><label>${esc(c.label)}</label><input data-rep="${f.key}" data-idx="${idx}" data-key="${c.key}" type="number" min="0" placeholder="0" value="${esc(it[c.key]||'')}" /></div>`).join('')+`</div>`;
  return `<div class="rep-item"><span class="rep-num">#${idx+1}</span>
    <button class="rep-del" data-del="${f.key}" data-idx="${idx}" title="Eliminar">✕</button>
    <div class="rep-grid">${fields}${caps}</div></div>`;
}

/* ---------- Render del paso ---------- */
function render(){
  if(state.submitted && state.current===ACTIVE_SCHEMA.steps.length-1){ stage.innerHTML=`<div class="step-view">${renderThanks()}</div>`; bindThanks(); renderProgress(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const step=ACTIVE_SCHEMA.steps[state.current];
  let html;
  if(step.tipo==='intro') html=renderIntro(step);
  else if(step.tipo==='review') html=renderReview(step);
  else html=renderForm(step);
  stage.innerHTML=`<div class="step-view">${html}</div>`;
  bindStep(step); renderProgress(); window.scrollTo({top:0,behavior:'smooth'});
}
function renderIntro(step){
  return `<div class="card"><div class="intro">
    <div class="badge">✨ Onboarding interactivo · intralabs.ai</div>
    <h1>${step.titulo}</h1><p class="lead">${esc(step.lead)}</p>
    <div class="feats">${step.feats.map(f=>`<div class="feat"><div class="fi">${f.i}</div><strong>${esc(f.t)}</strong><span>${esc(f.d)}</span></div>`).join('')}</div>
    <div class="meta-row">${step.meta.map(m=>`<span>${m.k} <b>${esc(m.v)}</b></span>`).join('')}</div>
    <button class="btn primary" id="startBtn" style="font-size:16px;padding:16px 38px">${state.submissionId?'Continuar →':'Comenzar ahora →'}</button>
  </div></div>`;
}
function renderForm(step){
  const store=d(step.id); let body='';
  if(step.fields){
    body+='<div class="grid">';
    step.fields.forEach(f=>{
      if(f.type==='repeater') body+=repeaterHTML(f,store);
      else if(f.type==='toggle-only'){ const on=store[f.key]===undefined?true:!!store[f.key];
        body+=`<div class="toggle-field ${on?'on':''}" data-toggle="${f.key}" style="grid-column:1/-1">
          <div class="toggle-row"><div class="tl"><strong>${esc(f.label)}</strong>${f.sub?`<span>${esc(f.sub)}</span>`:''}</div>
          <label class="switch"><input type="checkbox" data-toggle-input="${f.key}" ${on?'checked':''}/><span class="slider"></span></label></div></div>`; }
      else body+=fieldHTML(f, store[f.key]||'');
    });
    body+='</div>';
  }
  if(step.toggles) body+='<div class="grid">'+step.toggles.map(t=>toggleHTML(t,store)).join('')+'</div>';
  return `<div class="card">
    <div class="card-head"><div class="eyebrow"><span class="ico">${step.icon||''}</span> ${esc(step.eyebrow||'')}</div>
      <h1>${step.titulo}</h1><p>${esc(step.subtitulo||'')}</p></div>
    <div class="card-body">${body}
      <div class="nav-row"><button class="btn ghost" id="prevBtn">← Atrás</button><div class="btn-spacer"></div>
        <button class="btn primary" id="nextBtn">Continuar →</button></div>
    </div></div>`;
}
function renderReview(step){
  let blocks='';
  ACTIVE_SCHEMA.steps.forEach((s,i)=>{ if(s.tipo==='intro'||s.tipo==='review') return; blocks+=reviewBlock(s,i); });
  const cta = state.submissionId? 'Reenviar cambios' : 'Enviar a Intralabs';
  const note = state.submissionId
    ? 'Ya enviaste esta información antes. Si hiciste cambios, reenvíalos para que el equipo vea la última versión.'
    : 'Al enviar, tu información llega de forma segura al equipo de Intralabs para construir tu agente. Podrás volver y editar cuando quieras.';
  return `<div class="card">
    <div class="card-head"><div class="eyebrow"><span class="ico">${step.icon}</span> ${esc(step.eyebrow)}</div>
      <h1>${step.titulo}</h1><p>${esc(step.subtitulo)}</p></div>
    <div class="card-body">${blocks}
      <div class="submit-panel">
        <h3>${state.submissionId?'Reenviar tu información':'Todo listo para enviar'}</h3>
        <p>${note}</p>
        <button class="btn primary" id="submitBtn" style="font-size:16px;padding:16px 40px">${cta} →</button>
      </div>
      <div class="nav-row" style="margin-top:22px"><button class="btn ghost" id="prevBtn">← Atrás</button><div class="btn-spacer"></div></div>
    </div></div>`;
}
function renderThanks(){
  const ref=state.submissionId? state.submissionId.slice(0,8).toUpperCase() : '';
  return `<div class="card"><div class="thanks">
    <div class="big">✓</div>
    <h1>¡Información recibida! 🎉</h1>
    <p>Gracias. El equipo de <b>Intralabs</b> ya tiene los datos de tu hotel para construir tu agente de IA.</p>
    <p>¿Necesitas corregir algo? Puedes editar y <b>reenviar</b> cuando quieras — siempre tomaremos tu última versión.</p>
    ${ref?`<div class="ref">Folio: ${ref}</div>`:''}
    <div class="nav-row" style="justify-content:center;margin-top:30px">
      <button class="btn" id="editBtn">✏️ Editar mi información</button>
    </div></div></div>`;
}
function reviewBlock(s, idx){
  const store=d(s.id); let rows='';
  (s.fields||[]).forEach(f=>{
    if(f.type==='repeater'){ const items=store[f.key]||[];
      rows+=`<div class="kv full"><span class="k">${esc(f.label)} (${items.length})</span><span class="v">${items.length? items.map(it=>esc(it[f.item.title]||'(sin nombre)')).join(' · ') : '—'}</span></div>`; return; }
    if(f.type==='toggle-only'){ const on=store[f.key]===undefined?true:!!store[f.key];
      rows+=`<div class="kv"><span class="k">${esc(f.label)}</span><span class="v">${on?'Sí':'No'}</span></div>`; return; }
    const v=store[f.key];
    rows+=`<div class="kv ${v?'':'empty'} ${f.full||f.type==='textarea'?'full':''}"><span class="k">${esc(f.label)}</span><span class="v">${v?esc(v):'Sin completar'}</span></div>`;
  });
  (s.toggles||[]).forEach(t=>{ const on=!!store[t.key]; const det=store[t.key+'_detalle'];
    rows+=`<div class="kv"><span class="k">${esc(t.label)}</span><span class="v">${on?('Sí'+(det?' — '+esc(det):'')):'No'}</span></div>`; });
  return `<div class="review-block"><div class="rb-head" data-goto="${idx}"><h3>${s.icon||''} ${stripTags(s.titulo)}</h3><span class="edit">Editar ✎</span></div>
    <div class="rb-body">${rows||'<div class="kv full empty"><span class="v">Sin datos</span></div>'}</div></div>`;
}

/* ---------- Progreso / navegación ---------- */
function renderProgress(){
  const total=ACTIVE_SCHEMA.steps.length;
  const pct=Math.round((state.current/(total-1))*100);
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('progressPct').textContent=KB.completion(state.data)+'% completado';
  document.getElementById('progressLabel').textContent=`Paso ${state.current+1} de ${total}`;
  const nav=document.getElementById('stepsNav');
  nav.innerHTML=ACTIVE_SCHEMA.steps.map((s,i)=>{ if(s.tipo==='intro') return '';
    const cls=i===state.current?'active':(i<state.current?'done':'');
    return `<div class="step-chip ${cls}" data-step="${i}"><span class="n"><span>${i}</span></span>${stripTags(s.titulo)}</div>`; }).join('');
  nav.querySelectorAll('[data-step]').forEach(el=>el.onclick=()=>go(+el.dataset.step));
  document.getElementById('progressWrap').style.display=ACTIVE_SCHEMA.steps[state.current].tipo==='intro'?'none':'block';
}
function go(i){ state.current=Math.max(0,Math.min(ACTIVE_SCHEMA.steps.length-1,i)); if(state.submitted && i<ACTIVE_SCHEMA.steps.length-1) state.submitted=false; save(); render(); }
function next(){ if(validateStep()) go(state.current+1); }
function prev(){ go(state.current-1); }
function validateStep(){
  const step=ACTIVE_SCHEMA.steps[state.current]; if(!step.fields) return true;
  let ok=true, firstBad=null;
  step.fields.forEach(f=>{ if(f.req){ const v=(d(step.id)[f.key]||'').toString().trim(); const el=stage.querySelector(`[data-field="${f.key}"]`);
    if(!v){ ok=false; if(el){el.classList.add('invalid'); if(!firstBad)firstBad=el;} } else if(el) el.classList.remove('invalid'); } });
  if(!ok&&firstBad){ firstBad.scrollIntoView({behavior:'smooth',block:'center'}); toast('Completa los campos obligatorios','⚠️',true); }
  return ok;
}

/* ---------- Bind ---------- */
function bindStep(step){
  const startBtn=document.getElementById('startBtn'); if(startBtn) startBtn.onclick=()=>go(1);
  const nextBtn=document.getElementById('nextBtn'); if(nextBtn) nextBtn.onclick=next;
  const prevBtn=document.getElementById('prevBtn'); if(prevBtn) prevBtn.onclick=prev;
  const submitBtn=document.getElementById('submitBtn'); if(submitBtn) submitBtn.onclick=submit;
  stage.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>go(+el.dataset.goto));

  stage.querySelectorAll('[data-key]').forEach(el=>{ if(el.hasAttribute('data-rep')) return;
    el.addEventListener('input',()=>{ d(step.id)[el.dataset.key]=el.value; save();
      const fld=el.closest('.field'); if(fld&&fld.classList.contains('invalid')&&el.value.trim()) fld.classList.remove('invalid'); }); });
  stage.querySelectorAll('[data-toggle-input]').forEach(el=>{ el.addEventListener('change',()=>{ d(step.id)[el.dataset.toggleInput]=el.checked;
    const box=el.closest('.toggle-field'); if(box) box.classList.toggle('on',el.checked); save(); }); });
  stage.querySelectorAll('[data-rep]').forEach(el=>{ el.addEventListener('input',()=>{ const k=el.dataset.rep, idx=+el.dataset.idx;
    const arr=d(step.id)[k]||(d(step.id)[k]=[]); (arr[idx]||(arr[idx]={}))[el.dataset.key]=el.value; save(); }); });
  stage.querySelectorAll('[data-add]').forEach(btn=>{ btn.onclick=()=>{ const k=btn.dataset.add; const arr=d(step.id)[k]||(d(step.id)[k]=[]); arr.push({}); save(); rerenderRepeater(step,k); }; });
  stage.querySelectorAll('[data-del]').forEach(btn=>{ btn.onclick=()=>{ const k=btn.dataset.del, idx=+btn.dataset.idx; const arr=d(step.id)[k]||[]; arr.splice(idx,1); save(); rerenderRepeater(step,k); }; });
}
function rerenderRepeater(step,k){
  const f=step.fields.find(x=>x.key===k);
  const wrap=stage.querySelector(`[data-repeater="${k}"]`);
  const tmp=document.createElement('div'); tmp.innerHTML=repeaterHTML(f,d(step.id));
  wrap.replaceWith(tmp.firstElementChild); bindStep(step);
}
function bindThanks(){ const eb=document.getElementById('editBtn'); if(eb) eb.onclick=()=>{ state.submitted=false; save(); render(); }; }

/* ---------- Envío a Supabase ---------- */
async function submit(){
  const btn=document.getElementById('submitBtn'); if(!btn) return;
  if(!KB.configured()){ toast('El sistema aún no está conectado al backend (config.js).','⚠️',true); return; }
  btn.disabled=true; const original=btn.innerHTML; btn.innerHTML='<span class="spin"></span> Enviando…';
  try{
    const id=await KB.save({ id:state.submissionId, data:state.data, status:'enviado' });
    state.submissionId=id; state.submitted=true; save();
    toast('¡Enviado con éxito!','✓'); render();
  }catch(e){
    console.error(e); btn.disabled=false; btn.innerHTML=original;
    toast('No se pudo enviar: '+(e.message||e),'⚠️',true);
  }
}

/* ---------- Toast + init ---------- */
function toast(msg,icon,isErr){ const t=document.getElementById('toast'); document.getElementById('toastTxt').textContent=msg;
  t.querySelector('.ti').textContent=icon||'✓'; t.classList.toggle('err',!!isErr); t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2800); }
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.tagName==='INPUT'){ const nb=document.getElementById('nextBtn'); if(nb){e.preventDefault();nb.click();} }});

load(); render();
</script>
</body>
</html>
